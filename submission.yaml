submission:
  title: "PORTAI — Autonomous Port Congestion Predictor & Shift Planner" # REQUIRED — Project display name

  problem_statement: >                         # REQUIRED — 1-3 sentences. What problem? Who has it?
    Port dispatch and operations teams must coordinate vessel arrivals, berth capacity, crane availability, and cargo priority in high-throughput harbors.
    Spreadsheet-based and first-come-first-served workflows make harbor congestion, vessel delays, and equipment outages difficult to detect and mitigate early enough to prevent multi-million-dollar demurrage penalties.

  solution_summary: >                          # REQUIRED — 1-3 sentences. What did you build?
    PORTAI ingests vessel schedules, calculates explainable terminal congestion across a 72-hour predictive horizon, and automatically generates optimal berth and crane allocations.
    It includes an in-memory What-If incident simulator for equipment failures and an AI operations copilot for natural language dispatch briefings.

  key_features:                                # REQUIRED — List 3 to 5 specific features you implemented
    - "Automated Vessel Schedule Ingestion with validation for ETAs, ETDs, TEU volume, ship dimensions, and cargo priority"
    - "72-Hour Predictive Congestion Engine scoring rolling time horizons (NOW, 24H, 48H, 72H) across multiple terminal sectors"
    - "Priority-Aware Berth & STS Crane Optimizer cutting fleet dwell time by 40%-55% with alternate terminal rerouting"
    - "In-Memory What-If Disruption Simulator testing berth closures and crane outages without modifying persisted database state"
    - "Conversational AI Operations Copilot and automated 72-Hour Executive Shift Briefing generator"

  tech_stack:
    languages: ["Python", "TypeScript"]        # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: ["FastAPI", "React", "Tailwind CSS"] # e.g., ["FastAPI", "React"]
    ibm_technologies: ["IBM Bob"]              # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: ["SQLite", "SQLAlchemy"]        # e.g., ["PostgreSQL", "Redis"]
    other: ["Uvicorn", "Anthropic Claude API", "Google Gemini API", "pandas"] # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >                 # Optional but recommended — guides judges to your best work
    PORTAI's strongest capability is its cohesive end-to-end operational workflow: seamless CSV manifest ingestion, real-time mathematical congestion scoring, priority-aware berth and crane gang dispatching, non-destructive disruption simulation, and grounded AI shift briefings all unified in an intuitive, high-density dark command center UI.
    The in-memory What-If simulator is particularly powerful, enabling harbor masters to test crane or berth outages without impacting production schedules.

  known_limitations: >                         # Optional but recommended — be honest about gaps
    SQLite is used for local demonstration rather than a distributed cloud database; the optimizer uses a greedy heuristic constraint solver rather than a mixed-integer programming solver; authentication and user roles (Harbor Master vs Pilot) are not yet integrated; and the AI Copilot falls back to deterministic database-derived responses if external LLM API keys are not supplied.

